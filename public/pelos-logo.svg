<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- Pelos Barbershop Signature Beard Logo Vector Asset -->
  <defs>
    <linearGradient id="electricBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18C8FF" />
      <stop offset="100%" stop-color="#00AEEF" />
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Electric Blue Accent -->
  <circle cx="100" cy="100" r="92" stroke="#111111" stroke-width="4" />
  <circle cx="100" cy="100" r="88" stroke="#00AEEF" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Subtle Barber Shears Accent Silhouette (Behind) -->
  <path d="M72 45 L128 155 M128 45 L72 155" stroke="#00AEEF" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.35" />

  <!-- Stylized Mustache -->
  <path d="M100 88 C90 76 66 78 52 86 C64 96 82 95 98 90 C99 89 100 89 100 88 Z" fill="#FFFFFF" />
  <path d="M100 88 C110 76 134 78 148 86 C136 96 118 95 102 90 C101 89 100 89 100 88 Z" fill="#FFFFFF" />
  <circle cx="100" cy="89" r="2.5" fill="#00AEEF" />

  <!-- Sculpted Full Beard -->
  <path d="M54 94 C50 114 60 148 100 162 C140 148 150 114 146 94 C138 106 122 110 100 110 C78 110 62 106 54 94 Z" fill="url(#electricBlueGrad)" />
  
  <!-- Inner Beard Texture / Razor Lines -->
  <path d="M100 114 L100 156" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
  <path d="M84 116 C86 130 92 144 96 150" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M116 116 C114 130 108 144 104 150" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
  
  <!-- Sleek Modern Barber Comb Teeth Accent at Top -->
  <path d="M74 54 H126" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <path d="M78 57 V65 M84 57 V65 M90 57 V65 M96 57 V65 M102 57 V65 M108 57 V65 M114 57 V65 M120 57 V65" stroke="#00AEEF" stroke-width="2" stroke-linecap="round" />
  
  <!-- Subtle Brand Monogram Dot -->
  <circle cx="100" cy="38" r="3" fill="#18C8FF" filter="url(#blueGlow)" />
</svg>
